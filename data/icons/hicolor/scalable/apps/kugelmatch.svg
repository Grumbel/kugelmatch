<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>KugelMatch</title>
  <!-- Court -->
  <rect width="128" height="128" rx="16" fill="#0b0e14"/>
  <!-- Checker floor suggestion -->
  <g opacity="0.35">
    <rect x="16" y="88" width="24" height="16" fill="#3a4a5c"/>
    <rect x="40" y="88" width="24" height="16" fill="#1e2834"/>
    <rect x="64" y="88" width="24" height="16" fill="#3a4a5c"/>
    <rect x="88" y="88" width="24" height="16" fill="#1e2834"/>
    <rect x="16" y="104" width="24" height="12" fill="#1e2834"/>
    <rect x="40" y="104" width="24" height="12" fill="#3a4a5c"/>
    <rect x="64" y="104" width="24" height="12" fill="#1e2834"/>
    <rect x="88" y="104" width="24" height="12" fill="#3a4a5c"/>
  </g>
  <!-- Near paddle (cyan) -->
  <rect x="20" y="48" width="12" height="36" rx="3" fill="#4fc3f7"/>
  <!-- Far paddle (coral) -->
  <rect x="96" y="44" width="12" height="36" rx="3" fill="#ff8a65"/>
  <!-- Mirror ball -->
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfd8e8"/>
      <stop offset="75%" stop-color="#6b7c93"/>
      <stop offset="100%" stop-color="#2a3340"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="58" r="22" fill="url(#ball)"/>
  <!-- Specular highlight -->
  <ellipse cx="56" cy="48" rx="7" ry="5" fill="#ffffff" opacity="0.85"/>
  <!-- Ray lines -->
  <path d="M64 36 L72 18" stroke="#ffe082" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M78 46 L96 34" stroke="#ffe082" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M50 46 L28 30" stroke="#81d4fa" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
