name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ pkg-config libsdl2-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Smoke (CPU headless-ish)
        run: |
          # SDL may need a dummy video driver in CI
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          timeout 3 ./build/kugelmatch --cpu || test $? -eq 124 -o $? -eq 0
